# Render blueprint: one free web service (Docker). Secrets are entered in the Render dashboard.
services:
  - type: web
    name: momcheck
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_SPEECH_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Real phone calls (optional). Needs an upgraded Twilio account (the free trial blocks live call audio).
      # The app's public URL comes from RENDER_EXTERNAL_URL, which Render sets.
      - key: PHONE_CALLS
        value: "off"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3-flash-preview,gemini-3.1-flash-lite
      - key: GNANI_STT_MODEL
        value: prisma-v3.0
      - key: GNANI_TTS_MODEL
        value: timbre-v3.0
      - key: GNANI_TTS_VOICE
        value: Chetana
